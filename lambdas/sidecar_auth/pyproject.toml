[project]
name = "doh-sidecar-auth-lambda"
version = "0.1.0"
description = "DevOps Hero sidecar auth Lambda — Okta OAuth + JWT minting."
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]==2.9.0",
    "cryptography==43.0.1",
    "urllib3==2.2.3",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
