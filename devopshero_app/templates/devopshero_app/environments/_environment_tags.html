<div class="flex flex-wrap items-center gap-2">
    {% for tag in tags %}
    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-400">
        {{ tag.key }}={{ tag.value }}
        {% if can_admin %}
        <button hx-post="/environments/{{ environment.slug }}/tags/{{ tag.id }}/remove/"
                hx-target="#environment-tags"
                hx-swap="innerHTML"
                class="ml-0.5 hover:text-indigo-900 dark:hover:text-indigo-200">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
        {% endif %}
    </span>
    {% empty %}
    <span class="text-xs text-gray-400 dark:text-gray-500">No tags</span>
    {% endfor %}

    {% if can_admin %}
    <form hx-post="/environments/{{ environment.slug }}/tags/add/"
          hx-target="#environment-tags"
          hx-swap="innerHTML"
          class="inline-flex items-center gap-1">
        <input type="text" name="key" placeholder="key" required
               class="w-20 px-2 py-0.5 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400">
        <span class="text-xs text-gray-400">=</span>
        <input type="text" name="value" placeholder="value" required
               class="w-24 px-2 py-0.5 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400">
        <button type="submit"
                class="px-2 py-0.5 text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 border border-indigo-300 dark:border-indigo-600 rounded hover:bg-indigo-50 dark:hover:bg-indigo-500/10">
            Add
        </button>
    </form>
    {% endif %}
</div>
