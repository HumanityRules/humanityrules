{# Progress indicator with phase and percentage #}
<div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg p-4">
    <div class="flex items-center space-x-3 mb-2">
        <svg class="w-5 h-5 text-blue-600 dark:text-blue-400 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-medium text-blue-800 dark:text-blue-200">{{ message.content }}</span>
    </div>

    {% if message.metadata.percentage is not None %}
    <div class="w-full bg-blue-200 dark:bg-blue-800 rounded-full h-2">
        <div class="bg-blue-600 dark:bg-blue-400 h-2 rounded-full transition-all duration-300"
             style="width: {{ message.metadata.percentage }}%"></div>
    </div>
    <p class="text-xs text-blue-600 dark:text-blue-400 mt-1">{{ message.metadata.percentage }}% complete</p>
    {% endif %}
</div>
