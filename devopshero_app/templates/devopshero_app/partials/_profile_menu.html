{% comment %}
Profile dropdown menu.
Expected context:
  - current_user.name: User's display name
  - current_user.initials: User's initials (e.g., "VT")
  - profile_menu_items: List of menu items (name, url)
{% endcomment %}
<el-dropdown class="relative">
  <button class="relative flex items-center">
    <span class="absolute -inset-1.5"></span>
    <span class="sr-only">Open profile menu</span>
    <span class="flex size-8 items-center justify-center rounded-full bg-indigo-600 text-sm font-medium text-white">{{ current_user.initials|default:'?' }}</span>
    <span class="hidden lg:flex lg:items-center">
      <span aria-hidden="true" class="ml-4 text-sm/6 font-semibold text-gray-900 dark:text-white">{{ current_user.name|default:'Guest' }}</span>
      <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="ml-2 size-5 text-gray-400 dark:text-gray-500">
        <path d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
      </svg>
    </span>
  </button>
  <el-menu anchor="bottom end" popover class="w-32 origin-top-right rounded-md bg-white py-2 shadow-lg outline outline-gray-900/5 transition transition-discrete [--anchor-gap:--spacing(2.5)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in dark:bg-gray-800 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
    {% for menu_item in profile_menu_items %}
    <a href="{{ menu_item.url }}" class="block px-3 py-1 text-sm/6 text-gray-900 focus:bg-gray-50 focus:outline-hidden dark:text-white dark:focus:bg-white/5">{{ menu_item.name }}</a>
    {% endfor %}
  </el-menu>
</el-dropdown>
