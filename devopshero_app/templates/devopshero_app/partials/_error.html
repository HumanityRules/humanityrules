<div class="flex min-h-[400px] flex-col items-center justify-center text-center">
    <div class="rounded-full bg-red-100 p-4 dark:bg-red-900/20">
        <svg class="h-12 w-12 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-gray-900 dark:text-white">{{ error_code }}</h1>
    <p class="mt-2 text-lg text-gray-600 dark:text-gray-400">{{ error_message }}</p>
    <div class="mt-6">
        <a href="/dashboard/" 
           hx-get="/dashboard/"
           hx-target="#main-content"
           hx-swap="innerHTML"
           hx-push-url="true"
           class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
            Go to Dashboard
        </a>
    </div>
</div>
