<div class="max-w-2xl mx-auto px-8">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Connect GitHub</h1>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
            Select a GitHub organization to connect to <span class="font-medium text-gray-900 dark:text-white">{{ current_organization.name }}</span>.
        </p>
    </div>

    <form method="post" action="/github/select-installation">
        {% csrf_token %}

        <div class="space-y-3">
            {% for inst in installations %}
            <label class="flex items-center p-4 rounded-lg border border-gray-200 dark:border-white/10 cursor-pointer
                          hover:bg-gray-50 dark:hover:bg-white/5
                          has-[:checked]:border-indigo-600 has-[:checked]:ring-1 has-[:checked]:ring-indigo-600
                          dark:has-[:checked]:border-indigo-500 dark:has-[:checked]:ring-indigo-500
                          transition-colors">
                <input type="radio"
                       name="installation_id"
                       value="{{ inst.id }}"
                       {% if forloop.first %}checked{% endif %}
                       class="h-4 w-4 text-indigo-600 border-gray-300 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5 dark:focus:ring-indigo-500">
                <img src="{{ inst.avatar_url }}" alt="{{ inst.account_name }}" class="ml-4 h-10 w-10 rounded-full bg-gray-100 dark:bg-white/10">
                <div class="ml-4">
                    <div class="text-sm font-semibold text-gray-900 dark:text-white">{{ inst.account_name }}</div>
                    <div class="text-xs text-gray-500 dark:text-gray-400">{{ inst.account_type }}</div>
                </div>
            </label>
            {% endfor %}
        </div>

        <div class="mt-8 flex items-center justify-between">
            <a href="{{ install_new_url }}"
               class="text-sm font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300">
                Install on a new GitHub organization &rarr;
            </a>
            <div class="flex items-center space-x-3">
                <a href="{% url 'integrations_git_integrations' %}"
                   class="rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:ring-white/10 dark:hover:bg-white/20">
                    Cancel
                </a>
                <button type="submit"
                        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:hover:bg-indigo-400">
                    Connect
                </button>
            </div>
        </div>
    </form>
</div>
