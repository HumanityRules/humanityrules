<div id="permission-statements-container" class="space-y-4">
    {% for statement in permission_request.statements %}
    <div class="permission-statement-card rounded-lg border border-gray-200 p-4 dark:border-gray-700" data-index="{{ forloop.counter0 }}">
        <div class="grid gap-3 md:grid-cols-2">
            <label class="block">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Service</span>
                <select name="service" class="mt-1 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white">
                    {% for service_name in service_options %}
                    <option value="{{ service_name }}" {% if service_name == statement.service %}selected{% endif %}>{{ service_name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="block">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Effect</span>
                <select name="effect" class="mt-1 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white">
                    <option value="Allow" {% if statement.effect == "Allow" %}selected{% endif %}>Allow</option>
                    <option value="Deny" {% if statement.effect == "Deny" %}selected{% endif %}>Deny</option>
                </select>
            </label>
        </div>
        <div class="mt-3 grid gap-3">
            <label class="block">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Actions (comma-separated)</span>
                <input type="text" name="actions" value="{{ statement.actions|join:', ' }}" class="mt-1 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-900 dark:text-white" />
            </label>
            <label class="block">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Resources (one per line)</span>
                <textarea name="resources" rows="2" class="mt-1 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm font-mono dark:border-gray-600 dark:bg-gray-900 dark:text-white">{% for r in statement.resources %}{{ r }}{% if not forloop.last %}
{% endif %}{% endfor %}</textarea>
            </label>
        </div>
        {% if statement.sid %}
        <p class="mt-2 text-xs text-gray-400 dark:text-gray-500">SID: {{ statement.sid }}</p>
        {% endif %}
    </div>
    {% empty %}
    <div class="rounded-lg border border-dashed border-gray-300 p-6 text-center text-sm text-gray-500 dark:border-gray-600 dark:text-gray-400">
        No policy statements yet. Add one below or ask the agent to configure permissions.
    </div>
    {% endfor %}
</div>
