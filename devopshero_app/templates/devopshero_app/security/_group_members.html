<div class="flex flex-wrap items-center gap-2">
    {% for membership in members %}
    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400">
        {{ membership.user.email }}
        <button hx-post="/security/groups/{{ group.id }}/members/{{ membership.id }}/remove/"
                hx-target="#group-members"
                hx-swap="innerHTML"
                class="ml-0.5 hover:text-blue-900 dark:hover:text-blue-200">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </span>
    {% empty %}
    <span class="text-xs text-gray-400 dark:text-gray-500">No members</span>
    {% endfor %}

    {% if available_users %}
    <form hx-post="/security/groups/{{ group.id }}/members/add/"
          hx-target="#group-members"
          hx-swap="innerHTML"
          class="inline-flex items-center gap-1">
        <select name="user_id" required
                class="px-2 py-0.5 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
            <option value="">Add member...</option>
            {% for user in available_users %}
            <option value="{{ user.id }}">{{ user.email }}</option>
            {% endfor %}
        </select>
        <button type="submit"
                class="px-2 py-0.5 text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 border border-indigo-300 dark:border-indigo-600 rounded hover:bg-indigo-50 dark:hover:bg-indigo-500/10">
            Add
        </button>
    </form>
    {% endif %}
</div>
