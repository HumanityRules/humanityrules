{% load static tailwind_tags %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-white dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevOps Hero{% endblock %}</title>

    {% htmx_script %}
    {% tailwind_css %}

    <!-- Include Tailwind Plus Elements for the components from Tailwind Application UI that require javascript -->
    <!-- like for example the profile dropdown menu -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>

    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 3s linear infinite;
        }
    </style>

    {% block extra_head %}{% endblock %}    
</head>
<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="h-full">
    {% block content %}{% endblock %}

    <!-- Debug: Animated indicator to verify HTMX partial loading (animation continues = no full reload) -->
    <div class="fixed bottom-4 right-4 z-50 flex items-center gap-2 rounded-full bg-gray-900/90 px-3 py-2 text-xs text-gray-400 shadow-lg">
        <svg class="h-5 w-5 animate-spin-slow" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18" stroke="url(#debug-gradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 30" />
            <circle cx="20" cy="20" r="8" fill="url(#debug-gradient)" />
            <defs>
                <linearGradient id="debug-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#818cf8" />
                    <stop offset="100%" stop-color="#6366f1" />
                </linearGradient>
            </defs>
        </svg>
        <span>HTMX</span>
    </div>
    
    <script>
        // Update sidebar active state after HTMX navigation
        document.body.addEventListener('htmx:pushedIntoHistory', function(event) {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(function(link) {
                const linkPath = link.getAttribute('data-nav-url');
                const isActive = linkPath === currentPath;
                
                // Update classes
                link.classList.remove('bg-white/5', 'text-white', 'text-gray-400', 'hover:bg-white/5', 'hover:text-white');
                if (isActive) {
                    link.classList.add('bg-white/5', 'text-white');
                } else {
                    link.classList.add('text-gray-400', 'hover:bg-white/5', 'hover:text-white');
                }
            });
        });
    </script>
</body>
</html>
