{# Code block with syntax highlighting #}
<div class="rounded-lg overflow-hidden">
    {% if message.metadata.filename %}
    <div class="bg-gray-200 dark:bg-gray-700 px-4 py-2 text-xs text-gray-600 dark:text-gray-400 flex justify-between items-center">
        <span>{{ message.metadata.filename }}</span>
        <button type="button"
                onclick="navigator.clipboard.writeText(this.closest('.rounded-lg').querySelector('code').textContent)"
                class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
        </button>
    </div>
    {% endif %}
    <pre class="bg-gray-900 text-gray-100 p-4 overflow-x-auto text-sm"><code class="language-{{ message.metadata.language|default:'text' }}">{{ message.content }}</code></pre>
</div>
