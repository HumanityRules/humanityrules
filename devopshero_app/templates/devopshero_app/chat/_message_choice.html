{# AskUserQuestion — read-only answered state on reload #}
<div class="space-y-3">
    {% for q in message.metadata.questions %}
    <div>
        <p class="text-sm text-gray-900 dark:text-gray-100 mb-2">{{ q.question }}</p>
        <div class="flex flex-wrap gap-2">
            {% for option in q.options %}
            <span class="px-4 py-2.5 text-sm font-medium rounded-lg border-1
                         {% if option.selected %}
                         border-indigo-500 bg-indigo-50 text-indigo-700 dark:border-indigo-400 dark:bg-indigo-600/80 dark:text-white
                         {% else %}
                         border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 opacity-40
                         {% endif %}">
                {{ option.label }}
            </span>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
