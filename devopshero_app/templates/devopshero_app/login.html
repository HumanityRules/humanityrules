{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - DevOps Hero</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="h-full bg-gray-900">
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <img class="mx-auto h-12 w-auto" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="DevOps Hero">
            <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-white">
                Sign in to your account
            </h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <a href="?start=1" 
               class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-2.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-indigo-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 transition-colors">
                Continue with WorkOS
            </a>

            <p class="mt-10 text-center text-sm/6 text-gray-400">
                Secure authentication powered by
                <a href="https://workos.com" target="_blank" rel="noopener" class="font-semibold text-indigo-400 hover:text-indigo-300">
                    WorkOS
                </a>
            </p>
        </div>
    </div>
</body>
</html>
