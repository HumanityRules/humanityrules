<div class="max-w-4xl">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Settings</h1>

    <!-- Settings Navigation -->
    <div class="flex h-12 border-b border-gray-200 dark:border-white/10">
        <div class="flex space-x-8">
            <a href="/settings/personal/"
               hx-get="/settings/personal/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'personal' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Personal Settings
            </a>
            {% if user_is_org_admin %}
            <a href="/settings/organization/"
               hx-get="/settings/organization/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'organization' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Organization Settings
            </a>
            <a href="/settings/billing/"
               hx-get="/settings/billing/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'billing' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Billing
            </a>
            {% endif %}
        </div>
    </div>

    <!-- Settings Content -->
    <div class="mt-6">
        {% block settings_content %}{% endblock %}
    </div>
</div>
