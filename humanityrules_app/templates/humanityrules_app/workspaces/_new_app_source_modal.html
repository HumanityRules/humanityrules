{# New App — source picker dialog (From Repository / From Template) #}
<div id="new-app-source-modal" class="hidden fixed inset-0 z-50">
    {# Backdrop #}
    <div class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/75"
         onclick="document.getElementById('new-app-source-modal').classList.add('hidden')"></div>

    {# Modal panel #}
    <div class="fixed inset-0 flex items-center justify-center p-4">
        <div class="relative bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-md w-full">
            {# Header #}
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">New App</h2>
                    <button type="button"
                            onclick="document.getElementById('new-app-source-modal').classList.add('hidden')"
                            class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">How would you like to create your app?</p>
            </div>

            {# Options #}
            <div class="p-4 space-y-2">
                {# From Repository #}
                <button type="button"
                        onclick="document.getElementById('new-app-source-modal').classList.add('hidden'); document.getElementById('repo-picker-modal').classList.remove('hidden')"
                        class="w-full flex items-start gap-4 p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-indigo-500 dark:hover:border-indigo-400 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left">
                    <div class="flex-shrink-0 mt-0.5">
                        <svg class="w-6 h-6 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900 dark:text-white">From Repository</h3>
                        <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">Deploy from one of your connected Git repositories.</p>
                    </div>
                </button>

                {# From Template #}
                <a href="{% url 'template_deploy_picker' %}"
                   hx-get="{% url 'template_deploy_picker' %}"
                   hx-target="#main-content"
                   hx-swap="innerHTML"
                   hx-push-url="true"
                   class="w-full flex items-start gap-4 p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-indigo-500 dark:hover:border-indigo-400 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left">
                    <div class="flex-shrink-0 mt-0.5">
                        <svg class="w-6 h-6 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900 dark:text-white">From Template</h3>
                        <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">Start from a pre-configured application template.</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const modal = document.getElementById('new-app-source-modal');
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
            modal.classList.add('hidden');
        }
    });
})();
</script>
