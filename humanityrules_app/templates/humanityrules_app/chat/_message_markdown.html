{% comment %}
Markdown message - rendered client-side using marked.js for consistency.
Uses |safe because browsers don't decode HTML entities inside <script> tags.
Safe because type="text/markdown" is inert data, not executable JS.
{% endcomment %}
<div class="markdown-content" data-markdown-content>
    <script type="text/markdown">{{ message.content|safe }}</script>
</div>
