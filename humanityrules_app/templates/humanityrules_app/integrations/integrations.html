<div class="max-w-4xl">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Integrations</h1>

    <div class="flex h-12 border-b border-gray-200 dark:border-white/10">
        <div class="flex space-x-8">
            <a href="{% url 'integrations_org_shared_keys' %}"
               hx-get="{% url 'integrations_org_shared_keys' %}"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'provider-keys' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Provider Keys
            </a>
            <a href="{% url 'integrations_org_aws_accounts' %}"
               hx-get="{% url 'integrations_org_aws_accounts' %}"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'aws-accounts' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                AWS Accounts
            </a>
            <a href="{% url 'integrations_org_github' %}"
               hx-get="{% url 'integrations_org_github' %}"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'git-integrations' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Git Integrations
            </a>
        </div>
    </div>

    <div class="mt-6">
        {% block integrations_content %}{% endblock %}
    </div>
</div>
