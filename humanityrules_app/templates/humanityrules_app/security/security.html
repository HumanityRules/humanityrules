<div class="max-w-5xl">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Security</h1>

    <!-- Security Navigation -->
    <div class="flex h-12 border-b border-gray-200 dark:border-white/10">
        <div class="flex space-x-8">
            <a href="/security/hub/"
               hx-get="/security/hub/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'hub' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Hub
            </a>
            {% if user_is_org_admin %}
            <a href="/security/people/"
               hx-get="/security/people/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'people' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                People
            </a>
            <a href="/security/groups/"
               hx-get="/security/groups/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'groups' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Groups
            </a>
            <a href="/security/policies/"
               hx-get="/security/policies/"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="inline-flex items-center border-b-2 px-1 pt-1 text-sm font-medium
                      {% if active_tab == 'policies' %}border-indigo-600 text-gray-900 dark:border-indigo-500 dark:text-white{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-300 dark:hover:border-white/20 dark:hover:text-white{% endif %}">
                Policies
            </a>
            {% endif %}
        </div>
    </div>

    <!-- Security Content -->
    <div class="mt-6">
        {% block security_content %}{% endblock %}
    </div>
</div>
