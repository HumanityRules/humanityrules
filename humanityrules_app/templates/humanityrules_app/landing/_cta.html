{% comment %}
Landing page CTA section - final call to action with a sign-up button.
{% endcomment %}

<section id="cta" class="landing-section min-h-screen flex items-center pt-16 pb-8 relative overflow-hidden">
    <div class="absolute inset-0 bg-grid-pattern opacity-30"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-cyber-500/10 rounded-full blur-3xl"></div>

    <div class="container-custom relative z-10">
        <div class="relative max-w-4xl mx-auto">
            <div class="absolute inset-0 bg-gradient-to-r from-cyber-500/20 via-cyan-500/20 to-teal-500/20 rounded-3xl blur-2xl"></div>

            <div class="relative p-12 md:p-16 bg-navy-900/80 backdrop-blur-sm border border-white/10 rounded-3xl text-center">
                <h2 class="text-4xl sm:text-5xl font-bold text-white mb-8 leading-tight">
                    Your agents.
                    <span class="gradient-text">Your rules.</span>
                </h2>

                <!-- Sign-up call to action -->
                <div class="flex justify-center">
                    {% if is_authenticated %}
                        <a href="/dashboard/" class="group inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-cyber-400 to-cyan-400 text-navy-950 font-semibold text-base rounded-full transition-all duration-300 hover:shadow-glow hover:scale-105">
                            Go to Dashboard
                            <svg class="w-5 h-5 transform group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                            </svg>
                        </a>
                    {% else %}
                        <a href="/auth/login/?screen_hint=sign-up" class="group inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-cyber-400 to-cyan-400 text-navy-950 font-semibold text-base rounded-full transition-all duration-300 hover:shadow-glow hover:scale-105">
                            Sign up
                            <svg class="w-5 h-5 transform group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                            </svg>
                        </a>
                    {% endif %}
                </div>

                <!-- Trust badges -->
                <div class="mt-10 pt-10 border-t border-white/5">
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-8 text-sm text-gray-500">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                            <span>Deployed in your own cloud</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                            <span>No model lock-in</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                            <span>Your data stays yours</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
