{% comment %}
Landing page killer-feature section 01 - Internal apps: self-service deployment
straight into your VPC. Text left, animated "permission approval card" right.
The card animation is driven by the self-contained IIFE <script> at the bottom
of this partial (IntersectionObserver, loops with a pause like the #solution
terminal). All selectors are namespaced under #approval-card so this partial
does not depend on landing_page.html's script block.
{% endcomment %}

<section id="internal-apps" class="landing-section section-padding relative overflow-hidden min-h-screen flex items-center">
    <div class="absolute inset-0 bg-grid-pattern opacity-30"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyber-500/5 rounded-full blur-3xl"></div>

    <div class="container-custom relative z-10">
        <div class="grid lg:grid-cols-2 gap-16 items-center">
            <!-- Left column: text content -->
            <div>
                <h2 class="text-4xl sm:text-5xl font-bold text-white mb-6 leading-tight">
                    Internal apps,<br>
                    <span class="gradient-text">without the tickets.</span>
                </h2>

                <p class="text-2xl sm:text-3xl font-medium text-gray-200 mb-8 leading-tight">
                    Self-service deployment of internal apps, straight into your VPC.
                </p>

                <p class="text-lg text-gray-400 mb-6 leading-relaxed">
                    Your team is already using AI to build dashboards, tools, and reports. Humanity Rules
                    gives every employee a personal agent that not only writes the app, but also ships it: sharing is only
                    one prompt away. No pipelines, no deployment limbo.
                </p>

                <p class="text-lg text-gray-400 leading-relaxed">
                    And because the platform lives in your AWS account, apps can work with your data: S3
                    buckets, DynamoDB tables, internal APIs, plus the third-party connectors you've already
                    vetted. Nothing is wired up silently: every access starts as a permission request,
                    granted by a human, scoped to exactly that bucket or table, and remembered by the audit
                    trail.
                </p>
            </div>

            <!-- Right column: animated permission approval card -->
            <div class="relative" id="approval-card">
                <div class="absolute -inset-4 bg-gradient-to-r from-cyber-500/20 via-cyan-500/20 to-teal-500/20 rounded-3xl blur-2xl opacity-60"></div>
                <div class="relative bg-navy-900/90 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
                    <!-- Card header -->
                    <div class="flex items-center gap-2 px-4 py-3 bg-white/[0.02] border-b border-white/5">
                        <div class="p-1.5 bg-cyber-500/10 rounded-lg">
                            <!-- Shield icon -->
                            <svg class="w-4 h-4 text-cyber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                            </svg>
                        </div>
                        <span class="text-sm font-semibold text-white">Permission request</span>
                        <span class="ml-auto text-xs text-gray-500 font-mono">cost-dashboard</span>
                    </div>

                    <!-- Card body -->
                    <div class="p-6 space-y-4">
                        <p class="text-sm text-gray-400 leading-relaxed">
                            <span class="text-white font-medium">cost-dashboard</span> is requesting access to:
                        </p>

                        <!-- Requested resources -->
                        <div class="space-y-3">
                            <!-- S3 bucket -->
                            <div class="flex items-center gap-3 p-3 rounded-lg bg-white/[0.02] border border-white/5">
                                <!-- Bucket / database icon -->
                                <svg class="w-5 h-5 text-cyber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>
                                </svg>
                                <span class="font-mono text-sm text-gray-300 truncate">s3://acme-billing-reports</span>
                                <span class="ml-auto text-[10px] font-semibold uppercase tracking-wider text-cyber-300 bg-cyber-500/10 border border-white/5 rounded-full px-2 py-0.5">read-only</span>
                            </div>

                            <!-- DynamoDB table -->
                            <div class="flex items-center gap-3 p-3 rounded-lg bg-white/[0.02] border border-white/5">
                                <!-- Table icon -->
                                <svg class="w-5 h-5 text-cyber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>
                                </svg>
                                <span class="font-mono text-sm text-gray-300 truncate">dynamodb: acme-usage-metrics</span>
                                <span class="ml-auto text-[10px] font-semibold uppercase tracking-wider text-cyber-300 bg-cyber-500/10 border border-white/5 rounded-full px-2 py-0.5">read-only</span>
                            </div>
                        </div>

                        <!-- Approve / Deny buttons -->
                        <div id="approval-actions" class="flex items-center gap-3 pt-1 transition-all duration-500">
                            <button type="button" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-gradient-to-r from-cyber-400 to-cyan-500 text-navy-950 text-sm font-semibold">
                                <!-- Check icon -->
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 6 9 17l-5-5"/>
                                </svg>
                                Approve
                            </button>
                            <button type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-red-500/10 border border-white/10 text-red-400 text-sm font-semibold">
                                Deny
                            </button>
                        </div>

                        <!-- Granted state (hidden by default) -->
                        <div id="approval-success" class="hidden p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-lg animate-fade-in-landing">
                            <div class="flex items-center gap-2 text-emerald-400 font-semibold">
                                <!-- Check icon -->
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 6 9 17l-5-5"/>
                                </svg>
                                Access granted by IT
                            </div>
                            <div class="mt-3 space-y-2">
                                <div class="flex items-center gap-2 text-emerald-300 text-xs">
                                    <!-- Target / scope icon -->
                                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                                    </svg>
                                    Scoped to those two resources, nothing more
                                </div>
                                <div class="flex items-center gap-2 text-emerald-300 text-xs">
                                    <!-- File-check / audit icon -->
                                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/>
                                    </svg>
                                    Logged to the audit trail
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var card = document.getElementById('approval-card');
        if (!card) return;

        var actions = document.getElementById('approval-actions');
        var success = document.getElementById('approval-success');

        function reset() {
            if (success) success.classList.add('hidden');
            if (actions) {
                actions.classList.remove('opacity-0');
                actions.classList.add('opacity-100');
            }
        }

        function grant() {
            // Fade the Approve/Deny buttons out, then reveal the granted state.
            if (actions) {
                actions.classList.remove('opacity-100');
                actions.classList.add('opacity-0');
            }
            setTimeout(function() {
                if (actions) actions.classList.add('hidden');
                if (success) success.classList.remove('hidden');
            }, 500);
        }

        function loop() {
            reset();
            if (actions) actions.classList.remove('hidden');
            // Beat before approving, hold on the granted state, then restart.
            setTimeout(grant, 2200);
            setTimeout(loop, 7000);
        }

        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting && !card.dataset.started) {
                    card.dataset.started = 'true';
                    loop();
                }
            });
        }, { threshold: 0.3 });

        observer.observe(card);
    })();
    </script>
</section>
