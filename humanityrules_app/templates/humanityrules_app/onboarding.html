{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Organization - DevOps Hero</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="h-full" style="background-color: #0f1623;">
    <div class="flex min-h-full flex-col justify-center px-8 py-12">
        <div class="mx-auto w-full max-w-md text-center">
            <img class="mx-auto h-12 w-auto" src="{% static 'humanityrules_app/devops-hero-logo-small.png' %}" alt="DevOps Hero">
            
            <h2 class="mt-8 text-2xl font-bold text-white">
                Welcome to DevOps Hero!
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Signed in as <span class="text-gray-300">{{ email }}</span>
            </p>
        </div>

        <div class="mt-8 mx-auto w-full max-w-sm">
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div>
                    <label for="organization_name" class="block text-sm font-medium text-gray-300">
                        Organization name
                    </label>
                    <div class="mt-2">
                        <input type="text" 
                               name="organization_name" 
                               id="organization_name" 
                               required
                               autofocus
                               placeholder="Acme Corp"
                               class="block w-full rounded-md border-0 bg-white/5 py-2.5 px-3 text-white shadow-sm ring-1 ring-inset ring-white/10 placeholder:text-gray-500 focus:ring-2 focus:ring-inset focus:ring-indigo-500 text-sm">
                    </div>
                    <p class="mt-2 text-xs text-gray-500">
                        This is usually your company or team name.
                    </p>
                </div>

                <button type="submit" 
                        class="flex w-full justify-center rounded-md bg-indigo-500 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 transition-colors">
                    Create Organization
                </button>
            </form>
        </div>
    </div>
</body>
</html>
