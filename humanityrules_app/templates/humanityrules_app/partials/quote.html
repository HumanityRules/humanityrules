<div id="quote-box" style="padding: 20px; background: #f0f4f8; border-radius: 8px; border-left: 4px solid #3b82f6;">
    <p style="font-style: italic; font-size: 1.1rem; margin: 0 0 10px 0;">"{{ quote }}"</p>
    <p style="margin: 0; color: #64748b;">— {{ author }}</p>
    <p style="margin: 10px 0 0 0; font-size: 0.8rem; color: #94a3b8;">Loaded at {{ timestamp }}</p>
</div>
