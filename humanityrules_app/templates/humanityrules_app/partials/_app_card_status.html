<div id="app-status-{{ app.slug }}" class="flex items-center justify-between"
    {% if app.latest_status == 'pending' or app.latest_status == 'deploying' or app.latest_status == 'teardown_pending' or app.latest_status == 'tearing_down' %}
    hx-get="{% url 'app_card_status' app_slug=app.slug %}"
    hx-trigger="load delay:10s"
    hx-swap="outerHTML"
    {% endif %}>
    <span class="text-gray-500 dark:text-gray-400">Status</span>
    {% if app.latest_status %}
    {% include "humanityrules_app/partials/_status_pill.html" with status=app.latest_status label=app.latest_status|title only %}
    {% else %}
    <span class="text-gray-500 dark:text-gray-400">—</span>
    {% endif %}
</div>
