<div>
    {% if p1_label %}
    <a href="{{ p1_url }}"
       hx-get="{{ p1_url }}"
       hx-target="#main-content"
       hx-swap="innerHTML"
       hx-push-url="true"
       class="text-sm align-baseline text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400">{{ p1_label }}</a>
    <span class="text-sm align-baseline text-gray-400 dark:text-gray-500 mx-1">/</span>
    {% endif %}
    {% if p2_label %}
    <a href="{{ p2_url }}"
       hx-get="{{ p2_url }}"
       hx-target="#main-content"
       hx-swap="innerHTML"
       hx-push-url="true"
       class="text-sm align-baseline text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400">{{ p2_label }}</a>
    <span class="text-sm align-baseline text-gray-400 dark:text-gray-500 mx-1">/</span>
    {% endif %}
    <h1 class="inline align-baseline text-2xl font-bold text-gray-900 dark:text-white">{{ current }}</h1>
</div>
