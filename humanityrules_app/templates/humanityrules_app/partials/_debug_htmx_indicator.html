{% comment %}
Debug indicator to verify HTMX partial loading.
If the animation continues smoothly during navigation = no full reload.
If the animation restarts = full page reload occurred.
Remove this include from base.html when no longer needed.
{% endcomment %}
<style>
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
        animation: spin-slow 3s linear infinite;
    }
</style>
<div class="fixed bottom-2 right-2 z-50 flex items-center gap-2 rounded-full bg-gray-900/90 px-3 py-2 text-xs text-gray-400 shadow-lg">
    <svg class="h-5 w-5 animate-spin-slow" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="url(#debug-gradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 30" />
        <circle cx="20" cy="20" r="8" fill="url(#debug-gradient)" />
        <defs>
            <linearGradient id="debug-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#6366f1" />
            </linearGradient>
        </defs>
    </svg>
</div>
