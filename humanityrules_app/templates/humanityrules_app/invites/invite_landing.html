{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're invited - Humanity Rules</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="h-full" style="background-color: #0f1623;">
    <div class="flex min-h-full flex-col justify-center px-8 py-12">
        <div class="mx-auto w-full max-w-md text-center">
            <img class="mx-auto h-12 w-auto" src="{% static 'humanityrules_app/humr-logo-large-dark.png' %}" alt="Humanity Rules">

            <h2 class="mt-8 text-2xl font-bold text-white">
                You're invited to join {{ invite.organization.name }}
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Sign in with <span class="text-gray-300">{{ invite.email }}</span> to accept this invitation.
            </p>

            <a href="{{ login_url }}"
               class="mt-8 inline-flex items-center justify-center rounded-md bg-indigo-500 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-400 transition-colors">
                Sign in to accept
            </a>
        </div>
    </div>
</body>
</html>
