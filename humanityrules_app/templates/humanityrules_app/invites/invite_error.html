{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation problem - Humanity Rules</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="h-full" style="background-color: #0f1623;">
    <div class="flex min-h-full flex-col justify-center px-8 py-12">
        <div class="mx-auto w-full max-w-md text-center">
            <img class="mx-auto h-12 w-auto" src="{% static 'humanityrules_app/humr-logo-large.png' %}" alt="Humanity Rules">

            <h2 class="mt-8 text-2xl font-bold text-white">
                Can't accept this invitation
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                {% if organization_name %}For <span class="text-gray-300">{{ organization_name }}</span>{% endif %}
            </p>
            <p class="mt-4 text-sm text-gray-300">
                {{ error }}
            </p>
        </div>
    </div>
</body>
</html>
