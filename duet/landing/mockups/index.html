<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humanity Rules landing-page decision aid</title>
  <style>
    * { box-sizing: border-box; }

    body {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 12vh 0 48px;
      color: #171817;
      background: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }

    p { margin: 0 0 36px; }

    nav {
      display: grid;
      border-top: 1px solid #232522;
    }

    a {
      padding: 22px 0;
      border-bottom: 1px solid #c9cbc4;
      color: #171817;
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 650;
      line-height: 1.2;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }
  </style>
</head>
<body>
  <p>These are private decision-aid mockups for choosing the humanityrules.io landing page.</p>
  <nav aria-label="Landing-page mockups">

</html>
