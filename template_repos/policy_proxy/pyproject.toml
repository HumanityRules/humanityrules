[project]
name = "doh-policy-proxy"
version = "0.1.0"
description = "DevOps Hero policy proxy — SSO + ABAC gate for deployed apps."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "httpx==0.27.2",
    "pyjwt[crypto]==2.9.0",
    "cryptography==43.0.1",
    "boto3==1.35.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
