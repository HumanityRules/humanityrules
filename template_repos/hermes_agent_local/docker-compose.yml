# Local Hermes stack — same image as HUMR deploys, without the control plane.
#
#   cd template_repos/hermes_agent_local
#   cp .env.example .env   # optional
#   docker compose up --build --watch   # dev: logs + auto-rebuild on save (recommended)
#   docker compose up --build   # one-shot, no file watcher
#
# Browser entry: http://localhost:8788
#   - WebUI, Web Apps panel, /webapps/__admin, user apps at <slug>.localhost:8788
#
# Hermes Caddy/WebUI ports are not published to the host; reach them through
# local_policy_proxy (bundled here) or docker exec.
#
# `docker compose up --watch` rebuilds the Hermes image when HUMR source changes (~1s
# with layer cache), recreates the container, and the persistent-root runner
# rsyncs the new /opt/humr tree on start — reliable, no bind-mount clobber.
#
# Bedrock: mounts host ~/.aws and uses AWS_PROFILE (default bedrock_dev). Run
# refresh-bedrock-creds.sh periodically, or bedrock-creds-launchagent.sh
# on macOS so opsh keeps the profile fresh for Claude Code and this stack.

services:
  hermes:
    build:
      context: ../hermes_agent
      dockerfile: Dockerfile
      cache_from:
        - hermes-agent:local
    image: hermes-agent:local
    container_name: hermes-agent-local
    env_file:
      - path: .env
        required: false
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-bedrock_dev}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-${AWS_BEDROCK_REGION:-us-east-1}}
      HUMR_LLM_PROVIDER: ${HUMR_LLM_PROVIDER:-bedrock}
      HUMR_LLM_MODEL: ${HUMR_LLM_MODEL:-global.anthropic.claude-sonnet-5}
      HUMR_PUBLIC_HOSTNAME: localhost
      HERMES_WEBUI_SKIP_ONBOARDING: ${HERMES_WEBUI_SKIP_ONBOARDING:-1}
      # Control-plane app identity. supervisor.sh starts the integrations broker only
      # when all four are set; they point the local stack at the laptop's Django
      # (via the humanityrules.ngrok.io tunnel) as one existing App. Seed the DB
      # rows first: uv run manage.py seed_local_app.
      HUMR_CONTROL_PLANE_URL: ${HUMR_CONTROL_PLANE_URL:-https://humanityrules.ngrok.io}
      HUMR_ENV_BEARER: ${HUMR_ENV_BEARER:-}
      HUMR_OWNER_USERNAME: ${HUMR_OWNER_USERNAME:-}
      HUMR_APP_SLUG: ${HUMR_APP_SLUG:-}
      HUMR_MERGE_INTEGRATION_ENABLED: ${HUMR_MERGE_INTEGRATION_ENABLED:-true}
    expose:
      - "8787"
    volumes:
      - hermes-data:/hermes-persistent-root
      - ${HOME}/.aws:/hermes-persistent-root/root/.aws:ro
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8789/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    develop:
      watch:
        # Rebuild + recreate on save. Paths are relative to this compose file.
        # Late Dockerfile COPY layers make these rebuilds fast (~1s).
        - path: ../hermes_agent/humr_runtime
          action: rebuild
        - path: ../hermes_agent/webui-extension
          action: rebuild
        - path: ../hermes_agent/skills
          action: rebuild
        - path: ../hermes_agent/vendor/hermes-agent
          action: rebuild
        - path: ../hermes_agent/vendor/hermes-webui
          action: rebuild
        - path: ../hermes_agent/build
          action: rebuild
        - path: ../hermes_agent/Dockerfile
          action: rebuild
        - path: ../hermes_agent/SOUL.md
          action: rebuild
        - path: ../hermes_agent/config.yaml.template
          action: rebuild

  local_policy_proxy:
    build:
      context: ./local_policy_proxy
      dockerfile: Dockerfile
    image: local-policy-proxy:local
    container_name: local-policy-proxy-local
    environment:
      HUMR_UPSTREAM_HOST: hermes
      HUMR_UPSTREAM_PORT: 8787
      HUMR_LISTEN_PORT: 8788
    ports:
      - "8788:8788"
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hermes-data:
