# Run the Hermes Agent locally the way DOH runs it in production: a hermes
# container plus a privileged docker-in-docker sidecar that executes the
# terminal-tool containers. Mirrors the two-container ECS task layout in
# devopshero_app/management/commands/seed_app_templates.py. No policy-proxy.
#
# Usage:
#   1. Create .env next to this file with at minimum:
#        DOH_LLM_PROVIDER=bedrock           # or: custom
#        DOH_LLM_MODEL=us.anthropic.claude-sonnet-4-6
#        AWS_BEDROCK_REGION=us-west-2       # bedrock only
#        AWS_ACCESS_KEY_ID=...              # bedrock only (no task role locally)
#        AWS_SECRET_ACCESS_KEY=...
#        # or, for custom:
#        # DOH_LLM_BASE_URL=https://api.openai.com/v1
#        # OPENAI_API_KEY=...
#      See README.md in this directory for the full variable set.
#   2. docker compose up --build
#   3. Open http://localhost:8787
#
# Networking: the hermes service joins docker-dind's network namespace so
# DOCKER_HOST=tcp://127.0.0.1:2375 reaches dockerd over loopback, exactly the
# way it does inside an awsvpc ECS task. Because of that, port 8787 is
# published on docker-dind — a service using network_mode: service:X cannot
# publish its own ports.

services:
  # One-shot: match the EFS access-point uid/gid from seed_app_templates.py
  # (_HERMES_EFS_CONFIG) on the named volumes. Without this, hermes runs as
  # uid 1024 and can't write to root-owned volume mounts on first boot.
  volume-init:
    image: busybox:1.36
    restart: "no"
    command: >
      sh -c "
      mkdir -p /hermes-home /workspace /docker-persistence &&
      chown 1024:1024 /hermes-home /workspace &&
      chown 0:0 /docker-persistence
      "
    volumes:
      - hermes-home:/hermes-home
      - workspace:/workspace
      - docker-persistence:/docker-persistence

  docker-dind:
    build:
      context: ../doh_dind
    privileged: true
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      DOCKER_TLS_CERTDIR: ""
      # TOOL_IMAGE_BASE: nikolaik/python-nodejs:python3.11-nodejs20
      TOOL_IMAGE_BASE: python:3.12-slim-bookworm
      TINI_SUBREAPER: "1"
    volumes:
      - workspace:/workspace
      - docker-persistence:/var/lib/doh-dind/persistence
    ports:
      - "8787:8787"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1 && test -f /var/run/doh-restore-ready"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    # Give the snapshotter the same 120s SIGTERM window it has in prod so a
    # `docker compose down` doesn't interrupt a multi-GB docker save.
    stop_grace_period: 120s

  hermes:
    build:
      context: .
    depends_on:
      docker-dind:
        condition: service_healthy
    network_mode: "service:docker-dind"
    env_file:
      - path: .env
        required: true
    # Platform-constant env vars, copied from _HERMES_CONTAINER_BASE. Keep
    # user-facing keys (DOH_LLM_*, API keys, AWS_BEDROCK_REGION, SLACK_*) in
    # .env so they don't need edits here.
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      TOOL_IMAGE: doh-toolbox:latest
      TERMINAL_LIFETIME_SECONDS: "86400"
      TERMINAL_CONTAINER_DISK: "0"
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      - workspace:/workspace
    stop_grace_period: 120s

volumes:
  hermes-home:
  workspace:
  docker-persistence:
